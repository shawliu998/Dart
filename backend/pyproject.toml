[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bidevidence-backend"
version = "0.1.0"
description = "BidEvidence Phase 0+1 API"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2,<3",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.9,<1",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
  "reportlab>=4.2,<5",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "httpx>=0.27,<1",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-asyncio>=0.24,<1"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-openpyxl>=3.1,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[tool.setuptools.packages.find]
include = ["app*", "worker*", "scripts*"]
exclude = ["tests*", "data*", "alembic*"]
