name: bidevidence

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://bidevidence:bidevidence-local-only@postgres:5432/bidevidence}
  DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg://bidevidence:bidevidence-local-only@postgres:5432/bidevidence}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin-local-only}
  S3_BUCKET: ${S3_BUCKET:-bidevidence}
  LLM_PROVIDER: mock
  AI_MANUAL_REVIEW_THRESHOLD: ${AI_MANUAL_REVIEW_THRESHOLD:-0.70}
  BIDEVIDENCE_OCR_MODE: ${BIDEVIDENCE_OCR_MODE:-auto}
  BIDEVIDENCE_OCR_LANGUAGES: ${BIDEVIDENCE_OCR_LANGUAGES:-chi_sim+eng}
  AUTH_SECRET: ${AUTH_SECRET:-development-only-change-me}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bidevidence}
      POSTGRES_USER: ${POSTGRES_USER:-bidevidence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bidevidence-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bidevidence} -d ${POSTGRES_DB:-bidevidence}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-local-only}
      S3_BUCKET: ${S3_BUCKET:-bidevidence}
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      mc mb --ignore-existing "local/$${S3_BUCKET}";
      mc anonymous set none "local/$${S3_BUCKET}";
      '
    restart: "no"

  api:
    image: python:3.12-slim
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
      - ./demo:/workspace/demo:ro
    environment: *backend-environment
    command: >-
      sh -c '
      pip install --disable-pip-version-check -r requirements-dev.txt &&
      if command -v alembic >/dev/null 2>&1 && [ -f alembic.ini ]; then alembic upgrade head; fi &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      '
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    image: python:3.12-slim
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
      - ./demo:/workspace/demo:ro
    environment: *backend-environment
    command: >-
      sh -c '
      pip install --disable-pip-version-check -r requirements-dev.txt &&
      while true; do python -m worker.main --once; sleep 5; done
      '
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    image: node:22-alpine
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      INTERNAL_API_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    command: sh -c 'npm install && npm run dev -- --hostname 0.0.0.0'
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
  frontend-node-modules:
